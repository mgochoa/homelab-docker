apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitwarden-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitwarden-logs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: bitwarden-settings
type: Opaque
# You'll need to populate this with your settings.env content
stringData:
  settings.env: |
    # Add your settings.env content here
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitwarden
  template:
    metadata:
      labels:
        app: bitwarden
    spec:
      containers:
      - name: bitwarden
        image: ghcr.io/bitwarden/self-host:beta
        envFrom:
        - secretRef:
            name: bitwarden-settings
        volumeMounts:
        - name: config
          mountPath: /etc/bitwarden
        - name: logs
          mountPath: /var/log/bitwarden
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: bitwarden-config
      - name: logs
        persistentVolumeClaim:
          claimName: bitwarden-logs
---
apiVersion: v1
kind: Service
metadata:
  name: bitwarden
spec:
  selector:
    app: bitwarden
  ports:
  - port: 80
    targetPort: 80