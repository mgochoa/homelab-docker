apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homepage-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  HOMEPAGE_ALLOWED_HOSTS: "homepage.molg.duckdns.org"
  PUID: "1000"
  PGID: "1000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        envFrom:
        - configMapRef:
            name: homepage-config
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: kubernetes-api
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: homepage-config
      - name: kubernetes-api
        secret:
          secretName: homepage-serviceaccount-token
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
spec:
  selector:
    app: homepage
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-role
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-role-binding
subjects:
- kind: ServiceAccount
  name: homepage-serviceaccount
  namespace: default
roleRef:
  kind: ClusterRole
  name: homepage-role
  apiGroup: rbac.authorization.k8s.io