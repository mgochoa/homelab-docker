apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mgochoa/homelab-docker.git
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
# Install ArgoCD using Helm values
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: argocd
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: "5.46.7"
  targetNamespace: argocd
  valuesContent: |-
    server:
      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - argocd.molg.example.com
        tls:
          - secretName: argocd-tls
            hosts:
              - argocd.molg.example.com
      extraArgs:
        - --insecure
    configs:
      cm:
        timeout.reconciliation: 30s
        application.instanceLabelKey: argocd.argoproj.io/instance