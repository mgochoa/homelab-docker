apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://k8s-at-home.com/charts/
    chart: jellyfin
    targetRevision: 9.5.1
    helm:
      values: |
        image:
          repository: jellyfin/jellyfin
          tag: latest
        env:
          TZ: "Europe/Amsterdam"
          PUID: "1000"
          PGID: "1000"
        persistence:
          config:
            enabled: true
            existingClaim: jellyfin-config
          media:
            enabled: true
            existingClaim: jellyfin-media
          tvshows:
            enabled: true
            existingClaim: jellyfin-tvshows
        ingress:
          main:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
            hosts:
              - host: jellyfin.molg.example.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: jellyfin-tls
                hosts:
                  - jellyfin.molg.example.com