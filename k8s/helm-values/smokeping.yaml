apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smokeping
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://k8s-at-home.com/charts/
    chart: smokeping
    targetRevision: 5.3.2
    helm:
      values: |
        image:
          repository: linuxserver/smokeping
          tag: latest
        env:
          TZ: "Europe/Amsterdam"
          PUID: "1001"
          PGID: "1001"
        persistence:
          config:
            enabled: true
            existingClaim: smokeping-config
          data:
            enabled: true
            existingClaim: smokeping-data
        resources:
          limits:
            memory: 4096Mi
        ingress:
          main:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
            hosts:
              - host: smokeping.molg.example.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: smokeping-tls
                hosts:
                  - smokeping.molg.example.com